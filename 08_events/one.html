    document.querySelector('#images').addEventListener('click', function(e){
        console.log(e.target.tagName); //e.target gives the target of the particular event on ehich the event was actually carried out
        if (e.target.tagName === 'IMG') {
            console.log(e.target.id);
            let removeIt = e.target.parentNode //e.target here gives the image but we want the whole to be removed hence need the li which is the parent of the image
            removeIt.remove()
        }
    
        
    })
